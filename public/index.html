<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 | Akses Ditolak</title>
  <style>
    :root { --ink:#17202a; --muted:#64707d; --paper:#f4f5f3; --line:#d9dedc; --accent:#176b5b; }
    * { box-sizing:border-box; } body { min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; background:var(--paper); color:var(--ink); font:16px/1.5 ui-sans-serif,system-ui,sans-serif; }
    main { width:min(560px,100%); padding:40px; border:1px solid var(--line); background:#fff; }
    .code { margin:0 0 20px; color:var(--accent); font:700 14px/1 ui-monospace,monospace; letter-spacing:.08em; }
    h1 { margin:0 0 12px; font-size:clamp(2rem,7vw,3.8rem); line-height:1; letter-spacing:-.04em; } p { max-width:38ch; margin:0; color:var(--muted); }
    @media (max-width:480px) { main { padding:28px; } }
  </style>
</head>
<body><main><p class="code">HTTP 403</p><h1>Akses ditolak.</h1><p>Halaman ini hanya tersedia untuk pengguna yang memiliki izin.</p></main></body>
</html>
